<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="btBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18" />
      <stop offset="50%" stop-color="#0c1626" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.0" />
    </linearGradient>
    <filter id="scanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" rx="12" fill="url(#btBg)" />

  <!-- Medical Grid Background -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="420" x2="800" y2="420" />
    <line x1="80" y1="0" x2="800" y2="480" />
  </g>

  <!-- Top Medical Header -->
  <g transform="translate(36, 32)">
    <rect width="728" height="54" rx="8" fill="#0f1e36" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="24" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">CLINICAL MRI NEURO-DIAGNOSTICS // AI PORTAL</text>
    <text x="24" y="42" fill="#7ba3cc" font-family="sans-serif" font-size="10.5">FastAPI Neural Inference Engine · Supabase Patient Logs · Transfer Learning CNN</text>

    <g transform="translate(560, 14)">
      <rect width="145" height="26" rx="13" fill="#0ea5e9" fill-opacity="0.16" stroke="#0ea5e9" stroke-opacity="0.4" />
      <circle cx="14" cy="13" r="3.5" fill="#38bdf8" />
      <text x="26" y="17" fill="#bae6fd" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">INFERENCE: 180ms</text>
    </g>
  </g>

  <!-- Left: MRI Scan Viewer Screen -->
  <g transform="translate(36, 102)">
    <rect width="400" height="342" rx="8" fill="#060912" stroke="#0ea5e9" stroke-opacity="0.3" />
    
    <!-- Coordinate crosshairs -->
    <line x1="200" y1="20" x2="200" y2="320" stroke="#0ea5e9" stroke-opacity="0.12" stroke-dasharray="3 3" />
    <line x1="20" y1="170" x2="380" y2="170" stroke="#0ea5e9" stroke-opacity="0.12" stroke-dasharray="3 3" />

    <!-- Stylized Axial Brain MRI Shape -->
    <g transform="translate(200, 170)">
      <!-- Outer brain cranium contour -->
      <path d="M 0 -115 C 65 -115, 115 -65, 115 0 C 115 70, 75 115, 0 115 C -75 115, -115 70, -115 0 C -115 -65, -65 -115, 0 -115 Z" fill="#13233a" stroke="#38bdf8" stroke-width="1.8" />
      <!-- Inner ventricular cavities -->
      <path d="M -30 -30 C -20 -60, 20 -60, 30 -30 C 40 10, -40 10, -30 -30 Z" fill="#060912" opacity="0.8" />
      <path d="M -20 15 C -15 45, 15 45, 20 15 C 25 -5, -25 -5, -20 15 Z" fill="#060912" opacity="0.8" />

      <!-- Highlighted Tumor Segmentation Mask (Red & Yellow Glow) -->
      <g transform="translate(45, -35)">
        <ellipse cx="0" cy="0" rx="28" ry="22" fill="#e51d1d" fill-opacity="0.45" stroke="#ff4747" stroke-width="2" filter="url(#scanGlow)" />
        <ellipse cx="-4" cy="-3" rx="15" ry="11" fill="#f59e0b" fill-opacity="0.6" />
        <circle cx="0" cy="0" r="3" fill="#ffffff" />
      </g>
    </g>

    <!-- Scanline Sweep Animation Representation -->
    <line x1="20" y1="135" x2="380" y2="135" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
    <rect x="20" y="75" width="360" height="60" fill="url(#scanGrad)" />

    <!-- Bounding Box Indicator -->
    <rect x="220" y="110" width="60" height="52" fill="none" stroke="#e51d1d" stroke-width="1.5" stroke-dasharray="4 2" />
    <text x="225" y="105" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">TUMOR ROI: 98.7%</text>

    <!-- Slice telemetry -->
    <text x="16" y="325" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">AXIAL SLICE 42/64 · T1-WEIGHTED POST-CONTRAST</text>
  </g>

  <!-- Right: Diagnostic Classification Results -->
  <g transform="translate(452, 102)">
    <rect width="312" height="342" rx="8" fill="#0f192b" stroke="#ffffff" stroke-opacity="0.08" />

    <g transform="translate(20, 20)">
      <text x="0" y="10" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">DIAGNOSTIC PREDICTION</text>
      
      <!-- Primary Classification Card -->
      <g transform="translate(0, 24)">
        <rect width="272" height="74" rx="6" fill="#1e131d" stroke="#e51d1d" stroke-opacity="0.4" />
        <text x="14" y="20" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">DETECTED PATHOLOGY</text>
        <text x="14" y="44" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Meningioma Tumor</text>
        <text x="14" y="62" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">CONFIDENCE: 98.7%</text>
      </g>

      <!-- Multi-class Probability Bars -->
      <g transform="translate(0, 118)">
        <text x="0" y="10" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">CLASS PROBABILITY DISTRIBUTION</text>

        <!-- Meningioma -->
        <g transform="translate(0, 24)">
          <text x="0" y="10" fill="#ffffff" font-family="sans-serif" font-size="9.5">Meningioma</text>
          <text x="240" y="10" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">98.7%</text>
          <rect x="0" y="16" width="272" height="6" rx="3" fill="#1b283d" />
          <rect x="0" y="16" width="268" height="6" rx="3" fill="#e51d1d" />
        </g>

        <!-- Glioma -->
        <g transform="translate(0, 54)">
          <text x="0" y="10" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Glioma</text>
          <text x="250" y="10" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">0.8%</text>
          <rect x="0" y="16" width="272" height="6" rx="3" fill="#1b283d" />
          <rect x="0" y="16" width="10" height="6" rx="3" fill="#38bdf8" />
        </g>

        <!-- Pituitary -->
        <g transform="translate(0, 84)">
          <text x="0" y="10" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Pituitary</text>
          <text x="250" y="10" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">0.4%</text>
          <rect x="0" y="16" width="272" height="6" rx="3" fill="#1b283d" />
          <rect x="0" y="16" width="6" height="6" rx="3" fill="#38bdf8" />
        </g>

        <!-- No Tumor -->
        <g transform="translate(0, 114)">
          <text x="0" y="10" fill="#94a3b8" font-family="sans-serif" font-size="9.5">No Tumor</text>
          <text x="250" y="10" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">0.1%</text>
          <rect x="0" y="16" width="272" height="6" rx="3" fill="#1b283d" />
          <rect x="0" y="16" width="3" height="6" rx="3" fill="#22c55e" />
        </g>
      </g>

      <!-- Supabase sync badge -->
      <g transform="translate(0, 275)">
        <rect width="272" height="26" rx="4" fill="#0c233c" stroke="#38bdf8" stroke-opacity="0.3" />
        <text x="12" y="17" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="9">✓ Scan session synced with Supabase</text>
      </g>
    </g>
  </g>
</svg>
