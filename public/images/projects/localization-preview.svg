<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="locBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e12" />
      <stop offset="50%" stop-color="#14161f" />
      <stop offset="100%" stop-color="#0a0b0e" />
    </linearGradient>
    <linearGradient id="locRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e51d1d" />
      <stop offset="100%" stop-color="#ff4747" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e51d1d" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <filter id="locGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#locBg)" rx="12" />
  <rect width="800" height="480" fill="url(#accentGlow)" rx="12" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="480" />
    <line x1="120" y1="0" x2="120" y2="480" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="280" y1="0" x2="280" y2="480" />
    <line x1="360" y1="0" x2="360" y2="480" />
    <line x1="440" y1="0" x2="440" y2="480" />
    <line x1="520" y1="0" x2="520" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="680" y1="0" x2="680" y2="480" />
    <line x1="760" y1="0" x2="760" y2="480" />
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="420" x2="800" y2="420" />
  </g>

  <!-- Editor Window Container -->
  <g transform="translate(40, 36)">
    <!-- Window chrome -->
    <rect width="720" height="408" rx="8" fill="#141720" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />
    <rect width="720" height="36" rx="8" fill="#1c202d" />
    <!-- Traffic lights -->
    <circle cx="20" cy="18" r="5" fill="#ff5f56" />
    <circle cx="36" cy="18" r="5" fill="#ffbd2e" />
    <circle cx="52" cy="18" r="5" fill="#27c93f" />

    <!-- File Tab -->
    <rect x="75" y="6" width="160" height="30" rx="4" fill="#141720" />
    <text x="95" y="25" fill="#ff4d4d" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">● Welcome.tsx</text>
    <text x="215" y="24" fill="#666" font-family="sans-serif" font-size="12">×</text>

    <!-- AST Diagnostic Pill -->
    <g transform="translate(540, 8)">
      <rect width="160" height="20" rx="10" fill="#e51d1d" fill-opacity="0.15" stroke="#e51d1d" stroke-opacity="0.4" />
      <circle cx="12" cy="10" r="3.5" fill="#ff3333" />
      <text x="24" y="14" fill="#ff6b6b" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">AST LINTER: ACTIVE</text>
    </g>

    <!-- Left Code Pane -->
    <g transform="translate(24, 60)" font-family="'JetBrains Mono', monospace" font-size="12">
      <!-- Line 1 -->
      <text x="0" y="20" fill="#5c6370">01</text>
      <text x="36" y="20" fill="#c678dd">import</text>
      <text x="86" y="20" fill="#abb2bf">{ useTranslation }</text>
      <text x="236" y="20" fill="#c678dd">from</text>
      <text x="276" y="20" fill="#98c379">'react-i18next'</text>
      <text x="390" y="20" fill="#5c6370">// ✨ Auto-injected</text>

      <!-- Line 2 -->
      <text x="0" y="44" fill="#5c6370">02</text>

      <!-- Line 3 -->
      <text x="0" y="68" fill="#5c6370">03</text>
      <text x="36" y="68" fill="#c678dd">export function</text>
      <text x="156" y="68" fill="#61afef">WelcomeCard</text>
      <text x="246" y="68" fill="#abb2bf">() {</text>

      <!-- Line 4 -->
      <text x="0" y="92" fill="#5c6370">04</text>
      <text x="56" y="92" fill="#c678dd">const</text>
      <text x="102" y="92" fill="#abb2bf">{ t } =</text>
      <text x="156" y="92" fill="#61afef">useTranslation</text>
      <text x="256" y="92" fill="#abb2bf">();</text>

      <!-- Line 5 -->
      <text x="0" y="116" fill="#5c6370">05</text>
      <text x="56" y="116" fill="#c678dd">return</text>
      <text x="110" y="116" fill="#abb2bf">(</text>

      <!-- Line 6 with Squiggle Warning -->
      <text x="0" y="140" fill="#5c6370">06</text>
      <text x="76" y="140" fill="#e06c75">&lt;button&gt;</text>
      <!-- Target hardcoded string -->
      <rect x="146" y="126" width="130" height="20" fill="#e51d1d" fill-opacity="0.18" stroke="#ff4747" stroke-width="1" rx="3" stroke-dasharray="3 2" />
      <text x="154" y="140" fill="#ff7070" font-weight="700">Submit Application</text>
      <text x="282" y="140" fill="#e06c75">&lt;/button&gt;</text>

      <!-- Line 7 -->
      <text x="0" y="164" fill="#5c6370">07</text>
      <text x="56" y="164" fill="#abb2bf">);</text>

      <!-- Line 8 -->
      <text x="0" y="188" fill="#5c6370">08</text>
      <text x="36" y="188" fill="#abb2bf">}</text>
    </g>

    <!-- QuickFix Overlay Flyout -->
    <g transform="translate(140, 200)">
      <rect width="400" height="120" rx="6" fill="#1e2230" stroke="#e51d1d" stroke-width="1.5" filter="url(#locGlow)" />
      <rect width="400" height="26" rx="6" fill="#e51d1d" fill-opacity="0.1" />
      <text x="14" y="18" fill="#ff8080" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">⚡ COPILOT QUICK FIX AVAILABLE</text>
      <text x="14" y="48" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Extract hardcoded string to translation resource</text>
      <text x="14" y="70" fill="#8892b0" font-family="'JetBrains Mono', monospace" font-size="11">Replace with: <tspan fill="#61afef">{t('actions.submitApplication')}</tspan></text>

      <!-- Action buttons in flyout -->
      <rect x="14" y="85" width="125" height="24" rx="4" fill="#e51d1d" />
      <text x="26" y="101" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="700">Apply Auto-Fix ↵</text>

      <rect x="150" y="85" width="115" height="24" rx="4" fill="#2d3245" />
      <text x="162" y="101" fill="#abb2bf" font-family="sans-serif" font-size="10.5">Ignore String Esc</text>
    </g>

    <!-- Bottom Status Bar -->
    <rect x="0" y="380" width="720" height="28" rx="0 0 8 8" fill="#0f1118" />
    <circle cx="16" cy="394" r="4" fill="#27c93f" />
    <text x="28" y="398" fill="#8892b0" font-family="'JetBrains Mono', monospace" font-size="10">Git Diff: 1 hardcoded string detected in 1 file</text>
    <text x="560" y="398" fill="#ff4747" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">VS CODE EXTENSION</text>
  </g>
</svg>
