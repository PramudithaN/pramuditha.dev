<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="oiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14" />
      <stop offset="50%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#08090f" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="12" fill="url(#oiBg)" />

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="420" x2="800" y2="420" />
  </g>

  <!-- Top Banner -->
  <g transform="translate(36, 32)">
    <rect width="728" height="54" rx="8" fill="#151c28" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="24" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">OPENISSUE.DEV // OPEN-SOURCE CONTRIBUTION</text>
    <text x="24" y="42" fill="#7589a8" font-family="sans-serif" font-size="10.5">Modern Open-Source Issue Tracker &amp; Triage Engine · TypeScript / Next.js / Tailwind CSS</text>

    <g transform="translate(565, 14)">
      <rect width="140" height="26" rx="13" fill="#22c55e" fill-opacity="0.16" stroke="#22c55e" stroke-opacity="0.35" />
      <circle cx="14" cy="13" r="3.5" fill="#22c55e" />
      <text x="26" y="17" fill="#86efac" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">MERGED &amp; DEPLOYED</text>
    </g>
  </g>

  <!-- Kanban Board Mockup -->
  <g transform="translate(36, 104)">
    <!-- Column 1: Triage -->
    <g transform="translate(0, 0)">
      <rect width="232" height="340" rx="8" fill="#101520" stroke="#ffffff" stroke-opacity="0.08" />
      <text x="16" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">TRIAGE &amp; BACKLOG (4)</text>

      <!-- Card 1 -->
      <g transform="translate(12, 40)">
        <rect width="208" height="74" rx="6" fill="#171e2c" stroke="#ffffff" stroke-opacity="0.06" />
        <text x="12" y="20" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Virtual scrolling for large logs</text>
        <text x="12" y="38" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">#142 opened by arnabnandy7</text>
        <rect x="12" y="48" width="55" height="16" rx="3" fill="#3b82f6" fill-opacity="0.2" />
        <text x="16" y="60" fill="#93c5fd" font-family="sans-serif" font-size="8.5">enhancement</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(12, 124)">
        <rect width="208" height="74" rx="6" fill="#171e2c" stroke="#ffffff" stroke-opacity="0.06" />
        <text x="12" y="20" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Markdown preview sanitize</text>
        <text x="12" y="38" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">#145 opened by contributor</text>
        <rect x="12" y="48" width="45" height="16" rx="3" fill="#e51d1d" fill-opacity="0.2" />
        <text x="16" y="60" fill="#fca5a5" font-family="sans-serif" font-size="8.5">security</text>
      </g>
    </g>

    <!-- Column 2: In Progress -->
    <g transform="translate(248, 0)">
      <rect width="232" height="340" rx="8" fill="#101520" stroke="#ffffff" stroke-opacity="0.08" />
      <text x="16" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">IN PROGRESS (2)</text>

      <!-- Card 1 -->
      <g transform="translate(12, 40)">
        <rect width="208" height="84" rx="6" fill="#171e2c" stroke="#3b82f6" stroke-opacity="0.3" />
        <text x="12" y="20" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Keyboard navigation shortcuts</text>
        <text x="12" y="38" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">PR #148 · PramudithaN</text>
        <rect x="12" y="52" width="60" height="18" rx="3" fill="#22c55e" fill-opacity="0.18" />
        <text x="16" y="65" fill="#86efac" font-family="sans-serif" font-size="9">✦ In Review</text>
      </g>
    </g>

    <!-- Column 3: Closed & Shipped -->
    <g transform="translate(496, 0)">
      <rect width="232" height="340" rx="8" fill="#101520" stroke="#ffffff" stroke-opacity="0.08" />
      <text x="16" y="26" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">COMPLETED &amp; SHIPPED (18)</text>

      <!-- Card 1 -->
      <g transform="translate(12, 40)">
        <rect width="208" height="74" rx="6" fill="#171e2c" stroke="#22c55e" stroke-opacity="0.4" />
        <text x="12" y="20" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Theme persistence across tab</text>
        <text x="12" y="38" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">PR #122 · Merged</text>
        <rect x="12" y="48" width="55" height="16" rx="3" fill="#22c55e" fill-opacity="0.2" />
        <text x="16" y="60" fill="#86efac" font-family="sans-serif" font-size="8.5">Merged 🚀</text>
      </g>
    </g>
  </g>
</svg>
