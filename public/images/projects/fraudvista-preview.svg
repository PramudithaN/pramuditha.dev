<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#101726" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="fGlowRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" rx="12" fill="url(#fBg)" />

  <!-- Security Telemetry Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="70" x2="800" y2="70" />
    <line x1="0" y1="140" x2="800" y2="140" />
    <line x1="0" y1="210" x2="800" y2="210" />
    <line x1="0" y1="280" x2="800" y2="280" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="420" x2="800" y2="420" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Top Banner -->
  <g transform="translate(36, 32)">
    <rect width="728" height="54" rx="8" fill="#141c2e" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="24" y="26" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">FRAUDVISTA // ENTERPRISE FRAUD INTELLIGENCE</text>
    <text x="24" y="42" fill="#7589a8" font-family="sans-serif" font-size="10.5">Real-time Transaction Risk Scoring · Graph Anomaly Detection · Ant Design UI Architecture</text>

    <g transform="translate(565, 14)">
      <rect width="140" height="26" rx="13" fill="#ef4444" fill-opacity="0.16" stroke="#ef4444" stroke-opacity="0.35" />
      <circle cx="14" cy="13" r="3.5" fill="#ef4444" />
      <text x="26" y="17" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">ALERT: ANOMALY 98.4</text>
    </g>
  </g>

  <!-- Left: Fraud Graph Network Canvas -->
  <g transform="translate(36, 102)">
    <rect width="450" height="342" rx="8" fill="#0f1524" stroke="#ffffff" stroke-opacity="0.08" />
    
    <text x="20" y="28" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">TRANSACTION NETWORK GRAPH</text>

    <!-- Network edges -->
    <g stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5">
      <line x1="120" y1="120" x2="220" y2="170" />
      <line x1="120" y1="240" x2="220" y2="170" />
      <line x1="220" y1="170" x2="340" y2="130" stroke="#ef4444" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="4 2" />
      <line x1="220" y1="170" x2="330" y2="260" />
      <line x1="340" y1="130" x2="410" y2="80" stroke="#ef4444" stroke-opacity="0.7" stroke-width="2" />
      <line x1="340" y1="130" x2="410" y2="190" stroke="#ef4444" stroke-opacity="0.7" stroke-width="2" />
    </g>

    <!-- Network nodes -->
    <!-- Safe Node 1 -->
    <circle cx="120" cy="120" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="120" y="124" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">ACC-01</text>

    <!-- Safe Node 2 -->
    <circle cx="120" cy="240" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="120" y="244" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">ACC-02</text>

    <!-- Midpoint Hub -->
    <circle cx="220" cy="170" r="20" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="220" y="174" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">MERCH</text>

    <!-- Flagged Fraud Node -->
    <circle cx="340" cy="130" r="24" fill="#450a0a" stroke="#ef4444" stroke-width="2.5" filter="url(#fGlow)" />
    <text x="340" y="134" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" text-anchor="middle">FLAGGED</text>
    <text x="340" y="146" fill="#fca5a5" font-family="sans-serif" font-size="7" text-anchor="middle">Risk: 98%</text>

    <!-- Child Shell Entities -->
    <circle cx="410" cy="80" r="12" fill="#3b0707" stroke="#ef4444" stroke-width="1.5" />
    <text x="410" y="83" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="middle">OFFSHORE</text>

    <circle cx="410" cy="190" r="12" fill="#3b0707" stroke="#ef4444" stroke-width="1.5" />
    <text x="410" y="193" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="middle">ATM-SPOOF</text>

    <!-- Legend bar at bottom -->
    <g transform="translate(20, 310)">
      <circle cx="6" cy="6" r="4" fill="#38bdf8" />
      <text x="16" y="10" fill="#94a3b8" font-family="sans-serif" font-size="9">Verified Accounts</text>

      <circle cx="120" cy="6" r="4" fill="#fbbf24" />
      <text x="130" y="10" fill="#94a3b8" font-family="sans-serif" font-size="9">Intermediary</text>

      <circle cx="220" cy="6" r="4" fill="#ef4444" />
      <text x="230" y="10" fill="#f87171" font-family="sans-serif" font-size="9">High-Risk Sybil Clusters</text>
    </g>
  </g>

  <!-- Right: Surveillance Telemetry Logs -->
  <g transform="translate(502, 102)">
    <rect width="262" height="342" rx="8" fill="#0f1524" stroke="#ffffff" stroke-opacity="0.08" />

    <g transform="translate(20, 20)">
      <text x="0" y="10" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">SUSPICIOUS ACTIVITIES</text>

      <!-- Alert Card 1 -->
      <g transform="translate(0, 26)">
        <rect width="222" height="66" rx="6" fill="#1c1926" stroke="#ef4444" stroke-opacity="0.4" />
        <text x="12" y="18" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">TX-98402 // VELOCITY BURST</text>
        <text x="12" y="34" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="600">$48,200.00 transferred in 3s</text>
        <text x="12" y="52" fill="#78716c" font-family="'JetBrains Mono', monospace" font-size="8.5">Source: Dublin / IP Spoof</text>
      </g>

      <!-- Alert Card 2 -->
      <g transform="translate(0, 102)">
        <rect width="222" height="66" rx="6" fill="#171e2e" stroke="#f59e0b" stroke-opacity="0.4" />
        <text x="12" y="18" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">TX-98399 // CARD TESTING</text>
        <text x="12" y="34" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="600">32 micro-charges detected</text>
        <text x="12" y="52" fill="#78716c" font-family="'JetBrains Mono', monospace" font-size="8.5">BIN: 411111****** / Multi-Merchant</text>
      </g>

      <!-- Investigator Actions -->
      <g transform="translate(0, 180)">
        <text x="0" y="12" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">TRIAGE ACTIONS</text>
        
        <rect x="0" y="24" width="222" height="30" rx="4" fill="#ef4444" />
        <text x="111" y="43" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Freeze Accounts &amp; Escalate</text>

        <rect x="0" y="62" width="222" height="30" rx="4" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.1" />
        <text x="111" y="81" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">Export Regulatory SAR Report</text>
      </g>
    </g>
  </g>
</svg>
