<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="wedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121013" />
      <stop offset="50%" stop-color="#1c161f" />
      <stop offset="100%" stop-color="#0e0c10" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d485" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="480" rx="12" fill="url(#wedBg)" />

  <!-- Ambient Golden Circles -->
  <circle cx="200" cy="120" r="140" fill="#d4af37" opacity="0.04" />
  <circle cx="650" cy="360" r="180" fill="#e51d1d" opacity="0.03" />

  <!-- Mobile Mockup Frame in Center-Left -->
  <g transform="translate(60, 30)">
    <!-- Phone Bezel -->
    <rect width="250" height="420" rx="32" fill="#18151c" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.4" />
    <!-- Dynamic Island / Speaker -->
    <rect x="85" y="12" width="80" height="18" rx="9" fill="#0b090e" />
    
    <!-- Phone Screen Content -->
    <g transform="translate(14, 40)">
      <rect width="222" height="350" rx="20" fill="#100d14" />
      
      <!-- Decorative floral ornament -->
      <path d="M 111 25 Q 111 40, 95 40 Q 111 40, 111 55 Q 111 40, 127 40 Q 111 40, 111 25 Z" fill="url(#goldGrad)" />
      
      <!-- Monogram -->
      <circle cx="111" cy="90" r="28" fill="#1b1622" stroke="url(#goldGrad)" stroke-width="1.2" />
      <text x="111" y="97" fill="url(#goldGrad)" font-family="'Playfair Display', serif" font-size="20" font-weight="700" text-anchor="middle">S &amp; P</text>
      
      <text x="111" y="140" fill="#ffffff" font-family="'Cinzel', serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">SAVE THE DATE</text>
      <text x="111" y="158" fill="#d4af37" font-family="sans-serif" font-size="9" letter-spacing="1.5" text-anchor="middle">NOVEMBER 28, 2026</text>

      <!-- Countdown Cards -->
      <g transform="translate(18, 175)">
        <rect x="0" y="0" width="40" height="40" rx="6" fill="#1c1724" stroke="#ffffff" stroke-opacity="0.08" />
        <text x="20" y="22" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">48</text>
        <text x="20" y="34" fill="#a89fae" font-family="sans-serif" font-size="7" text-anchor="middle">DAYS</text>

        <rect x="48" y="0" width="40" height="40" rx="6" fill="#1c1724" stroke="#ffffff" stroke-opacity="0.08" />
        <text x="68" y="22" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">14</text>
        <text x="68" y="34" fill="#a89fae" font-family="sans-serif" font-size="7" text-anchor="middle">HOURS</text>

        <rect x="96" y="0" width="40" height="40" rx="6" fill="#1c1724" stroke="#ffffff" stroke-opacity="0.08" />
        <text x="116" y="22" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">32</text>
        <text x="116" y="34" fill="#a89fae" font-family="sans-serif" font-size="7" text-anchor="middle">MINS</text>

        <rect x="144" y="0" width="40" height="40" rx="6" fill="#1c1724" stroke="#ffffff" stroke-opacity="0.08" />
        <text x="164" y="22" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">09</text>
        <text x="164" y="34" fill="#a89fae" font-family="sans-serif" font-size="7" text-anchor="middle">SECS</text>
      </g>

      <!-- RSVP Button in Mockup -->
      <g transform="translate(24, 240)">
        <rect width="174" height="34" rx="17" fill="url(#goldGrad)" filter="url(#goldGlow)" />
        <text x="87" y="22" fill="#140f04" font-family="sans-serif" font-size="10.5" font-weight="800" letter-spacing="1" text-anchor="middle">CONFIRM RSVP ✦</text>
      </g>

      <!-- Location Link -->
      <g transform="translate(24, 290)">
        <rect width="174" height="30" rx="6" fill="#181420" stroke="#ffffff" stroke-opacity="0.08" />
        <text x="87" y="19" fill="#e2dce6" font-family="sans-serif" font-size="9" text-anchor="middle">📍 Grand Ballroom &amp; Map</text>
      </g>
    </g>
  </g>

  <!-- Right Descriptive Section -->
  <g transform="translate(350, 48)">
    <rect width="400" height="384" rx="8" fill="#16131c" stroke="#ffffff" stroke-opacity="0.08" />
    
    <g transform="translate(28, 30)">
      <text x="0" y="0" fill="url(#goldGrad)" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">EXPERIENCE DESIGN // FRAMER MOTION</text>
      
      <text x="0" y="30" fill="#ffffff" font-family="'Cinzel', serif" font-size="20" font-weight="700">Digital Wedding Experience</text>
      
      <text x="0" y="60" fill="#b0a8ba" font-family="sans-serif" font-size="11.5" line-height="1.5">
        A bespoke interactive wedding invitation website built with React,
      </text>
      <text x="0" y="78" fill="#b0a8ba" font-family="sans-serif" font-size="11.5">
        Framer Motion physics, and Tailwind CSS. Provides couples with a
      </text>
      <text x="0" y="96" fill="#b0a8ba" font-family="sans-serif" font-size="11.5">
        luxurious, paperless invitation experience with instant RSVP sync.
      </text>

      <!-- Highlights Box -->
      <g transform="translate(0, 120)">
        <rect width="344" height="150" rx="6" fill="#1d1824" stroke="#d4af37" stroke-opacity="0.2" />
        
        <g transform="translate(16, 26)">
          <circle cx="6" cy="0" r="3" fill="#d4af37" />
          <text x="18" y="4" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="600">Real-Time RSVP &amp; Meal Choice Storage</text>
        </g>
        
        <g transform="translate(16, 56)">
          <circle cx="6" cy="0" r="3" fill="#d4af37" />
          <text x="18" y="4" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="600">Native Google Maps &amp; Apple Maps Deep-links</text>
        </g>

        <g transform="translate(16, 86)">
          <circle cx="6" cy="0" r="3" fill="#d4af37" />
          <text x="18" y="4" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="600">Add to Calendar (Google, Apple, Outlook) 1-Click</text>
        </g>

        <g transform="translate(16, 116)">
          <circle cx="6" cy="0" r="3" fill="#d4af37" />
          <text x="18" y="4" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="600">Ambient Background Audio &amp; Fluid Particle Canvas</text>
        </g>
      </g>

      <!-- Badges -->
      <g transform="translate(0, 290)">
        <rect width="90" height="26" rx="4" fill="#241d2d" stroke="#ffffff" stroke-opacity="0.1" />
        <text x="45" y="17" fill="#d4af37" font-family="sans-serif" font-size="9.5" text-anchor="middle">React 18</text>

        <rect x="100" y="0" width="115" height="26" rx="4" fill="#241d2d" stroke="#ffffff" stroke-opacity="0.1" />
        <text x="157" y="17" fill="#d4af37" font-family="sans-serif" font-size="9.5" text-anchor="middle">Framer Motion</text>

        <rect x="225" y="0" width="105" height="26" rx="4" fill="#241d2d" stroke="#ffffff" stroke-opacity="0.1" />
        <text x="277" y="17" fill="#d4af37" font-family="sans-serif" font-size="9.5" text-anchor="middle">Tailwind CSS</text>
      </g>
    </g>
  </g>
</svg>
